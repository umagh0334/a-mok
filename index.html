<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미니겜 천국</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#2c2440;--bg2:#14101f;--card:#241d33;--line:#3b3153;
  --ink:#efe9fb;--sub:#a394c4;--accent:#b48cff;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  background:radial-gradient(1100px 700px at 50% -10%,var(--bg1),var(--bg2));
  color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:20px 14px;
}
main{width:100%;max-width:640px}
header{text-align:center;margin:26px 0 30px}
h1{font-size:34px;letter-spacing:3px}
h1 .joy{display:inline-block;animation:wiggle 2.4s ease-in-out infinite;transform-origin:60% 60%}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.sub{color:var(--sub);font-size:14px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{
  display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.card:active{transform:translateY(-1px)}
.icon{
  width:58px;height:58px;border-radius:14px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:inset 0 -3px 8px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.35);
}
.icon.omok{background:linear-gradient(145deg,#e0b26a,#b8823f)}
.icon.othello{background:linear-gradient(145deg,#2f7a4e,#1e5735)}
.icon.tetris{background:linear-gradient(145deg,#5470d6,#2c3a80)}
.icon.soon{background:linear-gradient(145deg,#4a415f,#332c47)}
.info h2{font-size:18px;margin-bottom:4px}
.info p{color:var(--sub);font-size:13px;line-height:1.5}
.card.soon{opacity:.55;cursor:default}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:34px;opacity:.7}
</style>
</head>
<body>
<main>
  <header>
    <h1><span class="joy">🕹️</span> 미니겜 천국</h1>
    <p class="sub">심심할 때 한 판씩 · 설치 없음 · 모바일 OK</p>
  </header>

  <div class="grid">
    <a class="card" href="omok.html">
      <div class="icon omok">⚫</div>
      <div class="info">
        <h2>오목</h2>
        <p>렌주룰 15×15 · AI 대전 · 흑백 선택<br>난이도 4단계 (명인은... 직접 확인)</p>
      </div>
    </a>
    <a class="card" href="othello.html">
      <div class="icon othello">⚪</div>
      <div class="info">
        <h2>오델로</h2>
        <p>8×8 뒤집기 한 판 · AI 대전 · 흑백 선택<br>코너를 먹는 자가 승리한다</p>
      </div>
    </a>
    <a class="card" href="tetris.html">
      <div class="icon tetris">🧱</div>
      <div class="info">
        <h2>테트리스</h2>
        <p>클래식 낙하 퍼즐 · 홀드 / 고스트 / 7-bag<br>모바일 제스처 조작 · 최고 기록 저장</p>
      </div>
    </a>
    <div class="card soon">
      <div class="icon soon">🎲</div>
      <div class="info">
        <h2>다음 게임</h2>
        <p>준비 중…</p>
      </div>
    </div>
  </div>

  <footer>단일 HTML · 바닐라 JS · 외부 의존성 없음</footer>
</main>
</body>
</html>
