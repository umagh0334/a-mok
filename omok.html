<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오목 · Gomoku</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#3a2d1d;--bg2:#1b140c;--card:#2e2517;--line:#4a3a24;
  --ink:#f2e7d3;--sub:#b6a483;--accent:#e8b34b;--warn:#ff7a66;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  background:radial-gradient(1100px 700px at 50% -10%,var(--bg1),var(--bg2));
  color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:14px;
}
main{width:100%;max-width:640px}
header{display:flex;align-items:baseline;gap:10px;margin:2px 4px 12px}
.home{color:var(--sub);text-decoration:none;font-size:15px;padding-right:2px}
.home:hover{color:var(--ink)}
h1{font-size:24px;letter-spacing:2px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.tag{color:var(--sub);font-size:13px}
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
}
.turn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.dot{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.dot.black{background:radial-gradient(circle at 35% 30%,#777,#000)}
.dot.white{background:radial-gradient(circle at 35% 30%,#fff,#b9b6aa)}
.dot.draw{background:linear-gradient(135deg,#555,#ddd)}
#moveNum{color:var(--sub);font-weight:500;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select,button{
  font:inherit;font-size:13px;color:var(--ink);background:#3b2f1d;border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;cursor:pointer;-webkit-appearance:none;appearance:none;
}
select:hover,button:hover{border-color:#6b5636}
button.primary{background:var(--accent);border-color:var(--accent);color:#2b1d05;font-weight:700}
button:disabled{opacity:.4;cursor:default}
#status{min-height:22px;font-size:13px;color:var(--sub);margin:8px 6px 6px}
#status.warn{color:var(--warn);font-weight:600}
#boardWrap{display:flex;justify-content:center}
canvas{
  display:block;border-radius:8px;cursor:pointer;
  box-shadow:0 14px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.note{color:var(--sub);font-size:12px;text-align:center;margin:12px 0 4px}
#overlay{
  position:fixed;inset:0;background:rgba(10,7,3,.6);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:10;
}
#overlay.hidden{display:none}
.modal{
  background:#332918;border:1px solid #5d4a28;border-radius:16px;padding:30px 36px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.6);animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal .dot{width:44px;height:44px;margin:0 auto 14px;animation:winpop .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes winpop{from{transform:scale(0)}to{transform:scale(1)}}
.tdots{display:inline-flex;gap:3px;margin-left:2px;vertical-align:middle}
.tdots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:tb 1s ease-in-out infinite}
.tdots i:nth-child(2){animation-delay:.15s}
.tdots i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.modal h2{font-size:22px;margin-bottom:6px}
.modal p{color:var(--sub);font-size:14px;margin-bottom:20px}
.modal .row{display:flex;gap:8px;justify-content:center}
@media (max-width:520px){.toolbar{justify-content:center}h1{font-size:20px}}
</style>
</head>
<body>
<main>
  <header>
    <a class="home" href="./">←</a>
    <h1 id="title">오목</h1><span class="tag" id="tag">렌주룰 · 15×15</span>
  </header>

  <div class="toolbar">
    <div class="turn">
      <span id="turnDot" class="dot black"></span>
      <span id="turnText">흑 차례</span>
      <span id="moveNum">0수</span>
    </div>
    <div class="controls">
      <select id="modeSel" title="대전 모드">
        <option value="ai" selected>AI 대전</option>
        <option value="pvp">2인 대전</option>
      </select>
      <select id="colorSel" title="내 돌 색">
        <option value="black" selected>내가 흑</option>
        <option value="white">내가 백</option>
      </select>
      <select id="diffSel" title="AI 난이도">
        <option value="easy">AI 쉬움</option>
        <option value="normal" selected>AI 보통</option>
        <option value="hard">AI 어려움</option>
        <option value="master">AI 명인</option>
      </select>
      <select id="ruleSel" title="금수 룰">
        <option value="renju" selected>렌주룰 (금수 O)</option>
        <option value="free">삼삼 허용 (금수 X)</option>
      </select>
      <button id="soundBtn" title="효과음 켜기/끄기">🔊</button>
      <button id="undoBtn">무르기</button>
      <button id="newBtn" class="primary">새 게임</button>
    </div>
  </div>

  <div id="status">&nbsp;</div>
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <p class="note" id="ruleNote">흑 선공 · 정확히 5목만 승리(6목 이상 무효) · 흑 금수: 삼삼 3-3 / 사사 4-4 / 장목</p>
</main>

<div id="overlay" class="hidden">
  <div class="modal">
    <div id="modalDot" class="dot black"></div>
    <h2 id="modalTitle">흑 승리!</h2>
    <p id="modalDesc"></p>
    <div class="row">
      <button id="modalClose">판 보기</button>
      <button id="modalNew" class="primary">새 게임</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ===================== 게임 로직 (렌더링과 분리) ===================== */

const SIZE = 15, EMPTY = 0, BLACK = 1, WHITE = 2;
const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
const inB = (x, y) => x >= 0 && x < SIZE && y >= 0 && y < SIZE;

function makeBoard() {
  return Array.from({ length: SIZE }, () => new Array(SIZE).fill(EMPTY));
}

// 승패 판정: 마지막 착수점 기준 4방향 스캔, "정확히 5목"만 승리
function findWinLine(board, x, y) {
  const c = board[y][x];
  if (!c) return null;
  for (const [dx, dy] of DIRS) {
    const cells = [[x, y]];
    for (let s = 1; ; s++) {
      const nx = x + dx * s, ny = y + dy * s;
      if (inB(nx, ny) && board[ny][nx] === c) cells.push([nx, ny]); else break;
    }
    for (let s = 1; ; s++) {
      const nx = x - dx * s, ny = y - dy * s;
      if (inB(nx, ny) && board[ny][nx] === c) cells.unshift([nx, ny]); else break;
    }
    if (cells.length === 5) return cells;
  }
  return null;
}

function maxRunAt(board, x, y, dx, dy) {
  const c = board[y][x];
  let n = 1;
  for (let s = 1; ; s++) {
    const nx = x + dx * s, ny = y + dy * s;
    if (inB(nx, ny) && board[ny][nx] === c) n++; else break;
  }
  for (let s = 1; ; s++) {
    const nx = x - dx * s, ny = y - dy * s;
    if (inB(nx, ny) && board[ny][nx] === c) n++; else break;
  }
  return n;
}

function isOverlineAt(board, x, y) {
  for (const [dx, dy] of DIRS) if (maxRunAt(board, x, y, dx, dy) >= 6) return true;
  return false;
}

// 흑의 "4" 개수: (x,y)를 포함하는 5칸 창 중 흑4+빈1이고, 채우면 정확히 5목이 되는 창.
// 같은 돌 집합(열린4의 두 창)은 하나로 센다.
function countFours(board, x, y) {
  let total = 0;
  for (const [dx, dy] of DIRS) {
    const sets = new Set();
    for (let off = -4; off <= 0; off++) {
      const stones = [];
      let empties = 0, ok = true;
      for (let i = 0; i < 5; i++) {
        const nx = x + (off + i) * dx, ny = y + (off + i) * dy;
        if (!inB(nx, ny)) { ok = false; break; }
        const c = board[ny][nx];
        if (c === BLACK) stones.push(nx + ',' + ny);
        else if (c === EMPTY) empties++;
        else { ok = false; break; }
      }
      if (!ok || stones.length !== 4 || empties !== 1) continue;
      // 창 양끝 바깥에 흑이 있으면 채웠을 때 6목(장목) → 유효한 4 아님
      const bx = x + (off - 1) * dx, by = y + (off - 1) * dy;
      const ax = x + (off + 5) * dx, ay = y + (off + 5) * dy;
      if (inB(bx, by) && board[by][bx] === BLACK) continue;
      if (inB(ax, ay) && board[ay][ax] === BLACK) continue;
      sets.add(stones.sort().join('|'));
    }
    total += sets.size;
  }
  return total;
}

// (x,y)와 (ex,ey)를 모두 포함하는 열린4(양끝 빈칸, 완성 시 정확히 5목)가 생기는지
function makesStraightFour(board, x, y, ex, ey, dx, dy) {
  const p = k => {
    const nx = x + k * dx, ny = y + k * dy;
    return inB(nx, ny) ? board[ny][nx] : -1;
  };
  for (let off = -3; off <= 0; off++) {
    let hasE = false, ok = true;
    for (let i = 0; i < 4; i++) {
      const nx = x + (off + i) * dx, ny = y + (off + i) * dy;
      if (!inB(nx, ny) || board[ny][nx] !== BLACK) { ok = false; break; }
      if (nx === ex && ny === ey) hasE = true;
    }
    if (!ok || !hasE) continue;
    if (p(off - 1) !== EMPTY || p(off + 4) !== EMPTY) continue;
    if (p(off - 2) === BLACK || p(off + 5) === BLACK) continue;
    return true;
  }
  return false;
}

// 흑의 "열린3" 개수: 한 수 더 두면 열린4가 되는 방향의 수 (방향당 최대 1)
function countOpenThrees(board, x, y) {
  let total = 0;
  for (const [dx, dy] of DIRS) {
    let found = false;
    for (let off = -3; off <= 3 && !found; off++) {
      if (off === 0) continue;
      const ex = x + off * dx, ey = y + off * dy;
      if (!inB(ex, ey) || board[ey][ex] !== EMPTY) continue;
      board[ey][ex] = BLACK;
      if (makesStraightFour(board, x, y, ex, ey, dx, dy) && !isOverlineAt(board, ex, ey)) found = true;
      board[ey][ex] = EMPTY;
    }
    if (found) total++;
  }
  return total;
}

let renjuOn = true; // false면 자유룰: 흑 금수 없음(삼삼 허용)

// 렌주 금수 판정(흑 전용, 간이 구현). 5목 완성이 최우선(금수보다 우선해 승리).
function forbiddenReason(board, x, y) {
  if (!renjuOn) return null;
  board[y][x] = BLACK;
  let five = false, over = false;
  for (const [dx, dy] of DIRS) {
    const r = maxRunAt(board, x, y, dx, dy);
    if (r === 5) five = true;
    if (r >= 6) over = true;
  }
  let reason = null;
  if (!five) {
    if (over) reason = '장목(6목 이상)';
    else if (countFours(board, x, y) >= 2) reason = '사사(4-4)';
    else if (countOpenThrees(board, x, y) >= 2) reason = '삼삼(3-3)';
  }
  board[y][x] = EMPTY;
  return reason;
}

class Game {
  constructor() { this.gen = 0; this.reset(); }
  reset() {
    this.board = makeBoard();
    this.history = [];
    this.current = BLACK;
    this.winner = null;
    this.winLine = null;
    this.gen++;
  }
  tryPlace(x, y) {
    if (this.winner || !inB(x, y) || this.board[y][x] !== EMPTY) return { ok: false, reason: null };
    if (this.current === BLACK) {
      const f = forbiddenReason(this.board, x, y);
      if (f) return { ok: false, reason: f };
    }
    this.board[y][x] = this.current;
    this.history.push({ x, y, color: this.current });
    const line = findWinLine(this.board, x, y);
    if (line) { this.winner = this.current; this.winLine = line; }
    else if (this.history.length === SIZE * SIZE) this.winner = 'draw';
    else this.current = 3 - this.current;
    return { ok: true, reason: null };
  }
  undo(n) {
    while (n-- > 0 && this.history.length) {
      const m = this.history.pop();
      this.board[m.y][m.x] = EMPTY;
    }
    this.winner = null;
    this.winLine = null;
    this.current = this.history.length % 2 === 0 ? BLACK : WHITE;
  }
}

/* ===================== AI: 미니맥스 + 알파베타 ===================== */

const AI = (() => {
  const WIN = 1e7;
  const INNER_CAND = 8;
  // 5칸 창에 든 돌 개수별 점수 (한쪽 색만 있을 때)
  const WINDOW_W = [0, 2, 24, 240, 3200, 0];
  const DIFF = {
    easy:   { depth: 2, cand: 8,  rand: 0.5 },
    normal: { depth: 3, cand: 10, rand: 0.12 },
    hard:   { depth: 4, cand: 11, rand: 0 },
    master: { depth: 3, cand: 10, rand: 0.12 }, // 위장 접대: 평소 실력은 보통, 결정적 순간에 실수
  };

  function hasNeighbor(board, x, y, d) {
    for (let dy = -d; dy <= d; dy++) for (let dx = -d; dx <= d; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (inB(nx, ny) && board[ny][nx] !== EMPTY) return true;
    }
    return false;
  }

  // 전체 보드 5칸 창 스캔 평가. 열린 패턴일수록 겹치는 창이 많아 자연히 고득점.
  function evaluate(board, aiColor) {
    let score = 0;
    const sw = (x, y, dx, dy) => {
      let b = 0, w = 0;
      for (let i = 0; i < 5; i++) {
        const c = board[y + dy * i][x + dx * i];
        if (c === BLACK) b++; else if (c === WHITE) w++;
      }
      if ((b && w) || (!b && !w)) return 0;
      if (b === 5 || w === 5) return 0; // 실제 5목은 탐색 종단에서 처리, 여기 남는 건 장목 조각뿐
      const v = WINDOW_W[b || w];
      return ((b ? BLACK : WHITE) === aiColor) ? v : -v * 1.05; // 살짝 수비 성향
    };
    for (let y = 0; y < SIZE; y++) for (let x = 0; x <= SIZE - 5; x++) score += sw(x, y, 1, 0);
    for (let x = 0; x < SIZE; x++) for (let y = 0; y <= SIZE - 5; y++) score += sw(x, y, 0, 1);
    for (let y = 0; y <= SIZE - 5; y++) for (let x = 0; x <= SIZE - 5; x++) score += sw(x, y, 1, 1);
    for (let y = 4; y < SIZE; y++) for (let x = 0; x <= SIZE - 5; x++) score += sw(x, y, 1, -1);
    return score;
  }

  // 후보 정렬용 한 점 평가: 이 자리에 color를 뒀을 때 4방향 연속/열림 정도
  function lineValue(c, o) {
    if (c >= 5) return 1e7;
    if (c === 4) return o === 2 ? 5e5 : (o === 1 ? 6e4 : 0);
    if (c === 3) return o === 2 ? 1e4 : (o === 1 ? 600 : 0);
    if (c === 2) return o === 2 ? 350 : (o === 1 ? 60 : 5);
    return o === 2 ? 30 : (o === 1 ? 8 : 0);
  }
  function pointScore(board, x, y, color) {
    let total = 0;
    for (const [dx, dy] of DIRS) {
      let cnt = 1, open = 0;
      for (const sign of [1, -1]) {
        let i = 1;
        for (;;) {
          const nx = x + dx * i * sign, ny = y + dy * i * sign;
          if (inB(nx, ny) && board[ny][nx] === color) { cnt++; i++; }
          else { if (inB(nx, ny) && board[ny][nx] === EMPTY) open++; break; }
        }
      }
      total += lineValue(cnt, open);
    }
    return total;
  }

  // 후보 생성: 기존 돌 주변 2칸, 공격+수비 가치로 정렬, 흑이면 금수 제외
  function genMoves(board, color, limit) {
    const cands = [];
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      if (board[y][x] !== EMPTY || !hasNeighbor(board, x, y, 2)) continue;
      const s = pointScore(board, x, y, color) + pointScore(board, x, y, 3 - color) * 0.9;
      cands.push({ x, y, s });
    }
    cands.sort((a, b) => b.s - a.s);
    const out = [];
    for (const m of cands) {
      if (color === BLACK && forbiddenReason(board, m.x, m.y)) continue;
      out.push(m);
      if (out.length >= limit) break;
    }
    return out;
  }

  function collectImmediateWins(board, color) {
    const out = [];
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      if (board[y][x] !== EMPTY || !hasNeighbor(board, x, y, 1)) continue;
      board[y][x] = color;
      const w = findWinLine(board, x, y);
      board[y][x] = EMPTY;
      if (w) out.push({ x, y });
    }
    return out;
  }
  function findImmediateWin(board, color) {
    const w = collectImmediateWins(board, color);
    return w.length ? w[0] : null;
  }

  // 이스터에그 바보 모드: 이기는 수와 막는 수를 전부 피하고, 그럴싸한 상위 후보 중 랜덤
  function blunderMove(board, me) {
    const bad = new Set();
    for (const c of collectImmediateWins(board, me)) bad.add(c.x + ',' + c.y);
    for (const c of collectImmediateWins(board, 3 - me)) bad.add(c.x + ',' + c.y);
    const moves = genMoves(board, me, 12).filter(m => !bad.has(m.x + ',' + m.y));
    if (!moves.length) return findFallback(board);
    return moves[Math.floor(Math.random() * Math.min(3, moves.length))];
  }

  function search(board, depth, alpha, beta, color, aiColor, ply) {
    const moves = genMoves(board, color, INNER_CAND);
    if (!moves.length) return evaluate(board, aiColor);
    const maxing = color === aiColor;
    let best = maxing ? -Infinity : Infinity;
    for (const m of moves) {
      board[m.y][m.x] = color;
      let val;
      if (findWinLine(board, m.x, m.y)) {
        val = maxing ? WIN - ply * 1000 : -WIN + ply * 1000; // 빠른 승리 선호
      } else if (depth <= 1) {
        val = evaluate(board, aiColor);
      } else {
        val = search(board, depth - 1, alpha, beta, 3 - color, aiColor, ply + 1);
      }
      board[m.y][m.x] = EMPTY;
      if (maxing) { if (val > best) best = val; if (best > alpha) alpha = best; }
      else { if (val < best) best = val; if (best < beta) beta = best; }
      if (alpha >= beta) break;
    }
    return best;
  }

  function findBestMove(game, diffKey, throwMode) {
    const cfg = DIFF[diffKey] || DIFF.normal;
    const board = game.board.map(r => r.slice());
    const me = game.current, opp = 3 - me;

    if (game.history.length === 0) return { x: 7, y: 7 };

    const winMove = findImmediateWin(board, me);
    const threat = findImmediateWin(board, opp);
    if (throwMode) {
      // 바보 모드: 결정적 순간(즉승 or 위협)에만 일부러 딴 수를 둠. 평소엔 정상 탐색.
      if (winMove || threat) return blunderMove(board, me);
    } else {
      // 1) 내 즉시 승리  2) 상대 즉시 승리 차단 (깊이와 무관하게 항상)
      if (winMove) return winMove;
      if (threat && !(me === BLACK && forbiddenReason(board, threat.x, threat.y))) return threat;
    }

    // 3) 미니맥스 탐색
    const moves = genMoves(board, me, cfg.cand);
    if (!moves.length) return findFallback(board);
    const results = [];
    let alpha = -Infinity;
    for (const m of moves) {
      board[m.y][m.x] = me;
      let val;
      if (findWinLine(board, m.x, m.y)) val = WIN;
      else if (cfg.depth <= 1) val = evaluate(board, me);
      else val = search(board, cfg.depth - 1, alpha, Infinity, opp, me, 1);
      board[m.y][m.x] = EMPTY;
      results.push({ x: m.x, y: m.y, val });
      if (val > alpha) alpha = val;
    }
    results.sort((a, b) => b.val - a.val);

    // 난이도 랜덤성: 확률적으로 상위 3개 중 아무거나 (지는 수는 제외)
    let pick = results[0];
    if (cfg.rand > 0 && Math.random() < cfg.rand) {
      const pool = results.slice(0, 3).filter(r => r.val > -WIN / 2);
      if (pool.length) pick = pool[Math.floor(Math.random() * pool.length)];
    }
    return pick;
  }

  function findFallback(board) {
    for (let d = 0; d < SIZE; d++) for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      if (Math.max(Math.abs(x - 7), Math.abs(y - 7)) === d && board[y][x] === EMPTY) return { x, y };
    }
    return null;
  }

  return { findBestMove };
})();

/* ===================== 사운드 (Web Audio 합성) ===================== */

const Sound = (() => {
  let ac = null, master = null;
  let enabled = true;
  try { enabled = localStorage.getItem('omok-sound') !== 'off'; } catch (e) {}

  // 자동재생 정책: 사용자 제스처 이후 lazy 생성/재개
  function ctx() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = 0.7;
      // 마스터 버스 컴프레서: 레이어 겹칠 때 클리핑 방지
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -12;
      comp.knee.value = 20;
      comp.ratio.value = 8;
      comp.attack.value = 0.002;
      comp.release.value = 0.15;
      master.connect(comp).connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function env(node, t, vol, dur) {
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g).connect(master);
  }

  // 착수음: 노이즈 "딱" + 저음 사인파 "통" (주파수 랜덤으로 매번 미묘하게 다름)
  function stone() {
    if (!enabled) return;
    const a = ctx(), t = a.currentTime;
    const n = Math.round(a.sampleRate * 0.045);
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
    const src = a.createBufferSource();
    src.buffer = buf;
    const bp = a.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2000 + Math.random() * 800;
    bp.Q.value = 0.8;
    src.connect(bp);
    env(bp, t, 0.9, 0.05);
    src.start(t);
    const o = a.createOscillator();
    o.type = 'sine';
    const f = 150 + Math.random() * 40;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.09);
    env(o, t, 0.5, 0.1);
    o.start(t); o.stop(t + 0.12);
  }

  // 승리 임팩트 "쾅!": 새츄레이션 서브 드랍 + 몸통 노이즈 + 고역 크랙 어택 3레이어
  function boom() {
    if (!enabled) return;
    const a = ctx(), t = a.currentTime;
    // ① 서브 드랍(150→40Hz)을 tanh 새츄레이션에 통과 — 배음이 생겨 작은 스피커에서도 들림
    const o = a.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.28);
    const sh = a.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) curve[i] = Math.tanh((i / 128 - 1) * 4);
    sh.curve = curve;
    o.connect(sh);
    env(sh, t, 0.9, 0.4);
    o.start(t); o.stop(t + 0.45);
    // ②③ 노이즈 레이어
    const burst = (dur, type, freq, vol, decay) => {
      const n = Math.round(a.sampleRate * dur);
      const buf = a.createBuffer(1, n, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
      const src = a.createBufferSource();
      src.buffer = buf;
      const f = a.createBiquadFilter();
      f.type = type;
      f.frequency.value = freq;
      src.connect(f);
      env(f, t, vol, decay);
      src.start(t);
    };
    burst(0.16, 'lowpass', 500, 0.8, 0.16);   // ② 몸통 "우웅"
    burst(0.05, 'highpass', 1200, 0.7, 0.06); // ③ 크랙 "쾅" 어택
  }

  function forbid() {
    if (!enabled) return;
    const a = ctx(), t = a.currentTime;
    const o = a.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(140, t);
    o.frequency.setValueAtTime(110, t + 0.07);
    env(o, t, 0.15, 0.16);
    o.start(t); o.stop(t + 0.18);
  }

  // steps 원소가 배열이면 화음으로 동시 재생, 마지막 음은 길게 여운
  function melody(steps, dur, type, vol) {
    if (!enabled) return;
    const a = ctx(), t0 = a.currentTime;
    steps.forEach((s, i) => {
      const freqs = Array.isArray(s) ? s : [s];
      const t = t0 + i * dur;
      const ring = (i === steps.length - 1 ? 4 : 1.8) * dur;
      for (const f of freqs) {
        const o = a.createOscillator();
        o.type = type;
        o.frequency.value = f;
        env(o, t, vol / Math.sqrt(freqs.length), ring);
        o.start(t); o.stop(t + ring + 0.05);
      }
    });
  }
  const win  = () => melody([523.25, 659.25, 783.99, [1046.5, 1318.5, 1568]], 0.13, 'triangle', 0.34);
  const lose = () => melody([392, 329.63, 261.63], 0.18, 'sine', 0.25);
  const draw = () => melody([440, 440], 0.16, 'sine', 0.2);

  function toggle() {
    enabled = !enabled;
    try { localStorage.setItem('omok-sound', enabled ? 'on' : 'off'); } catch (e) {}
    return enabled;
  }
  return { stone, forbid, boom, win, lose, draw, toggle, get enabled() { return enabled; } };
})();

/* ===================== UI ===================== */

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const turnDot = $('turnDot'), turnText = $('turnText'), moveNum = $('moveNum');
const statusEl = $('status'), overlay = $('overlay');

const game = new Game();
let mode = 'ai', difficulty = 'normal';
let humanColor = BLACK; // AI 대전에서 사람이 잡은 돌
let aiThinking = false;
let hover = null;
let cell = 0, pad = 0, dpr = 1, bg = null, boardPx = 0;
let statusTimer = null;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 나무결 배경 + 격자 + 화점을 오프스크린 캔버스에 캐시
function buildBackground(px) {
  bg = document.createElement('canvas');
  bg.width = Math.round(px * dpr);
  bg.height = Math.round(px * dpr);
  const g = bg.getContext('2d');
  g.scale(dpr, dpr);

  const grad = g.createLinearGradient(0, 0, px, px);
  grad.addColorStop(0, '#e3b877');
  grad.addColorStop(.5, '#d8a75f');
  grad.addColorStop(1, '#c9924b');
  g.fillStyle = grad;
  g.fillRect(0, 0, px, px);

  const rnd = mulberry32(7);
  for (let i = 0; i < 55; i++) {
    const y0 = rnd() * px, amp = 1.5 + rnd() * 5;
    const freq = 0.008 + rnd() * 0.02, ph = rnd() * Math.PI * 2;
    g.strokeStyle = `rgba(122,74,26,${0.03 + rnd() * 0.06})`;
    g.lineWidth = 0.6 + rnd() * 1.6;
    g.beginPath();
    for (let X = -8; X <= px + 8; X += 6) {
      const Y = y0 + Math.sin(X * freq + ph) * amp;
      X === -8 ? g.moveTo(X, Y) : g.lineTo(X, Y);
    }
    g.stroke();
  }
  const sheen = g.createRadialGradient(px * .3, px * .25, px * .1, px * .5, px * .5, px * .9);
  sheen.addColorStop(0, 'rgba(255,235,200,.10)');
  sheen.addColorStop(1, 'rgba(80,45,10,.12)');
  g.fillStyle = sheen;
  g.fillRect(0, 0, px, px);

  g.strokeStyle = 'rgba(66,40,14,.9)';
  g.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    const p = pad + i * cell;
    g.beginPath(); g.moveTo(pad, p); g.lineTo(pad + (SIZE - 1) * cell, p); g.stroke();
    g.beginPath(); g.moveTo(p, pad); g.lineTo(p, pad + (SIZE - 1) * cell); g.stroke();
  }
  g.lineWidth = 2;
  g.strokeRect(pad, pad, (SIZE - 1) * cell, (SIZE - 1) * cell);

  g.fillStyle = 'rgba(50,30,10,.95)';
  for (const [hx, hy] of [[3, 3], [11, 3], [3, 11], [11, 11], [7, 7]]) {
    g.beginPath();
    g.arc(pad + hx * cell, pad + hy * cell, Math.max(2.5, cell * .09), 0, Math.PI * 2);
    g.fill();
  }
}

function resize() {
  const wrap = $('boardWrap');
  boardPx = Math.min(wrap.clientWidth, 620);
  dpr = window.devicePixelRatio || 1;
  canvas.style.width = boardPx + 'px';
  canvas.style.height = boardPx + 'px';
  canvas.width = Math.round(boardPx * dpr);
  canvas.height = Math.round(boardPx * dpr);
  cell = boardPx / (SIZE + 1);
  pad = cell;
  buildBackground(boardPx);
  render();
}

function gxy(gx, gy) { return [pad + gx * cell, pad + gy * cell]; }

function drawStone(gx, gy, color, alpha, scale = 1) {
  const [cx, cy] = gxy(gx, gy), r = cell * 0.44 * scale;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (alpha === 1) {
    ctx.shadowColor = 'rgba(0,0,0,.4)';
    ctx.shadowBlur = cell * .12;
    ctx.shadowOffsetY = cell * .06;
  }
  const gr = ctx.createRadialGradient(cx - r * .35, cy - r * .4, r * .1, cx, cy, r);
  if (color === BLACK) {
    gr.addColorStop(0, '#6b6b6b'); gr.addColorStop(.4, '#2a2a2a'); gr.addColorStop(1, '#000');
  } else {
    gr.addColorStop(0, '#fff'); gr.addColorStop(.65, '#f0efe9'); gr.addColorStop(1, '#c8c5b8');
  }
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  if (color === WHITE) {
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(0,0,0,.15)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function drawForbidden(gx, gy) {
  const [cx, cy] = gxy(gx, gy), r = cell * .28;
  ctx.save();
  ctx.strokeStyle = 'rgba(220,50,40,.95)';
  ctx.lineWidth = Math.max(2.5, cell * .09);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
  ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
  ctx.stroke();
  ctx.restore();
}

/* ===== 연출: 캔버스 애니메이션 (연출 중에만 rAF 루프 가동) ===== */

let anims = [];
let rafId = null;
const dropping = new Map(); // "x,y" -> 착수 드롭 애니메이션
const easeOutCubic = p => 1 - (1 - p) ** 3;
const easeOutBack = p => 1 + 2.70158 * ((p - 1) ** 3) + 1.70158 * ((p - 1) ** 2);

function addAnim(a) {
  a.t0 = performance.now();
  a.p = 0;
  anims.push(a);
  if (rafId == null) rafId = requestAnimationFrame(animTick);
}
function animTick(now) {
  const alive = [];
  for (const a of anims) {
    a.p = Math.min(1, (now - a.t0) / a.dur);
    if (a.p < 1) alive.push(a);
    else if (a.onEnd) a.onEnd();
  }
  anims = alive;
  render();
  rafId = anims.length ? requestAnimationFrame(animTick) : null;
  if (!anims.length) render(); // 마지막 정리 프레임
}
function clearAnims() {
  anims = [];
  dropping.clear();
  canvas.style.transform = '';
}

function animatePlace(gx, gy) {
  const key = gx + ',' + gy;
  const drop = { type: 'drop', dur: 200, onEnd: () => dropping.delete(key) };
  dropping.set(key, drop);
  addAnim(drop);
  addAnim({ type: 'ripple', gx, gy, dur: 450 });
}
function animateForbidden(gx, gy) {
  addAnim({ type: 'shake', gx, gy, dur: 380 });
}
function animateWin(line) {
  const parts = [];
  for (const [gx, gy] of line) {
    const [cx, cy] = gxy(gx, gy);
    for (let i = 0; i < 12; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = cell * (1.2 + Math.random() * 3.5);
      parts.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - cell * 1.5, // 위쪽으로 살짝 튀는 편향
        r: 1.5 + Math.random() * 2.5,
        hue: 25 + Math.random() * 25,
        l: Math.random() * 18,
        life: 0.7 + Math.random() * 0.6,
      });
    }
  }
  addAnim({ type: 'win', dur: 1600, line, parts });
  addAnim({ type: 'quake', dur: 600, onEnd: () => { canvas.style.transform = ''; } });
}

function drawAnims() {
  for (const a of anims) {
    if (a.type === 'ripple') {
      const [cx, cy] = gxy(a.gx, a.gy);
      const p = easeOutCubic(a.p);
      ctx.strokeStyle = `rgba(255,240,210,${0.35 * (1 - p)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, cell * (0.45 + p * 0.75), 0, Math.PI * 2);
      ctx.stroke();
    } else if (a.type === 'shake') {
      const off = Math.sin(a.p * Math.PI * 6) * (1 - a.p) * cell * 0.12;
      ctx.save();
      ctx.translate(off, 0);
      drawForbidden(a.gx, a.gy);
      ctx.restore();
    } else if (a.type === 'win') {
      drawWinAnim(a);
    } else if (a.type === 'quake') {
      // 화면 흔들기: 주파수 다른 사인파 조합 + 감쇠, 초반엔 금색 플래시
      const decay = (1 - a.p) ** 2;
      const A = cell * 0.4 * decay;
      const qx = Math.sin(a.p * 43) * A;
      const qy = Math.cos(a.p * 37 + 1.7) * A * 0.8;
      const rot = Math.sin(a.p * 29) * 0.5 * decay;
      canvas.style.transform = `translate(${qx}px,${qy}px) rotate(${rot}deg)`;
      if (a.p < 0.25) {
        ctx.fillStyle = `rgba(255,210,90,${0.22 * (1 - a.p / 0.25)})`;
        ctx.fillRect(0, 0, boardPx, boardPx);
      }
    }
  }
}

function drawWinAnim(a) {
  const ms = a.p * a.dur, t = ms / 1000;
  const [ax, ay] = gxy(a.line[0][0], a.line[0][1]);
  const [bx, by] = gxy(a.line[4][0], a.line[4][1]);
  // 라인이 첫 돌 → 마지막 돌로 자라남
  const lp = easeOutCubic(Math.min(1, a.p / 0.3));
  ctx.strokeStyle = 'rgba(255,196,40,.45)';
  ctx.lineWidth = cell * .22;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax + (bx - ax) * lp, ay + (by - ay) * lp);
  ctx.stroke();
  // 금색 링이 순서대로 팝
  a.line.forEach(([gx, gy], i) => {
    const rp = Math.min(1, Math.max(0, (ms - (150 + i * 110)) / 200));
    if (rp <= 0) return;
    const s = easeOutBack(rp);
    const [cx, cy] = gxy(gx, gy);
    ctx.strokeStyle = `rgba(255,196,40,${0.4 + 0.6 * rp})`;
    ctx.lineWidth = Math.max(2, cell * .07);
    ctx.beginPath();
    ctx.arc(cx, cy, cell * .5 * s, 0, Math.PI * 2);
    ctx.stroke();
  });
  // 금가루 파티클: 위치 = 초기 + v·t + ½g·t² (상태 없이 시간으로 계산)
  for (const q of a.parts) {
    const alpha = 1 - t / q.life;
    if (alpha <= 0) continue;
    const px = q.x + q.vx * t;
    const py = q.y + q.vy * t + cell * 9 * t * t;
    ctx.fillStyle = `hsla(${q.hue},92%,${52 + q.l}%,${alpha})`;
    ctx.beginPath();
    ctx.arc(px, py, q.r * (0.4 + 0.6 * alpha), 0, Math.PI * 2);
    ctx.fill();
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, boardPx, boardPx);
  if (bg) ctx.drawImage(bg, 0, 0, boardPx, boardPx);

  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    const c = game.board[y][x];
    if (!c) continue;
    const d = dropping.get(x + ',' + y);
    if (d) {
      // 착수 드롭: 크게+반투명으로 시작해 내려앉음
      const e = easeOutCubic(d.p);
      drawStone(x, y, c, 0.5 + 0.5 * e, 1.35 - 0.35 * e);
    } else {
      drawStone(x, y, c, 1);
    }
  }

  const last = game.history[game.history.length - 1];
  if (last) {
    const [cx, cy] = gxy(last.x, last.y);
    ctx.fillStyle = '#e64530';
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(2.5, cell * .1), 0, Math.PI * 2); ctx.fill();
  }

  if (game.winLine && !anims.some(a => a.type === 'win')) {
    const [x0, y0] = game.winLine[0];
    const [x4, y4] = game.winLine[game.winLine.length - 1];
    const [ax, ay] = gxy(x0, y0), [bx2, by2] = gxy(x4, y4);
    ctx.strokeStyle = 'rgba(255,196,40,.45)';
    ctx.lineWidth = cell * .22;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx2, by2); ctx.stroke();
    ctx.strokeStyle = '#ffc428';
    ctx.lineWidth = Math.max(2, cell * .07);
    for (const [wx, wy] of game.winLine) {
      const [cx, cy] = gxy(wx, wy);
      ctx.beginPath(); ctx.arc(cx, cy, cell * .5, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // 마우스 오버 프리뷰 (사람 차례에만)
  if (hover && !game.winner && !aiThinking &&
      (mode === 'pvp' || game.current === humanColor) &&
      game.board[hover.y][hover.x] === EMPTY) {
    const reason = game.current === BLACK ? forbiddenReason(game.board, hover.x, hover.y) : null;
    if (reason) drawForbidden(hover.x, hover.y);
    else drawStone(hover.x, hover.y, game.current, .45);
  }

  drawAnims();
}

function setStatus(msg, warn) {
  statusEl.textContent = msg || ' ';
  statusEl.classList.toggle('warn', !!warn);
}
function flashStatus(msg) {
  setStatus(msg, true);
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => setStatus(''), 2400);
}

function updateHud() {
  const cur = game.current;
  if (game.winner) {
    if (game.winner === 'draw') {
      turnDot.className = 'dot draw';
      turnText.textContent = '무승부';
    } else {
      turnDot.className = 'dot ' + (game.winner === BLACK ? 'black' : 'white');
      turnText.textContent = (game.winner === BLACK ? '흑' : '백') + ' 승리!';
    }
  } else {
    turnDot.className = 'dot ' + (cur === BLACK ? 'black' : 'white');
    if (aiThinking) {
      turnText.innerHTML = (humanColor === BLACK ? '백(AI)' : '흑(AI)') +
        ' 생각 중 <span class="tdots"><i></i><i></i><i></i></span>';
    } else {
      turnText.textContent = (cur === BLACK ? '흑' : '백') + ' 차례' + (mode === 'ai' && cur !== humanColor ? ' (AI)' : '');
    }
  }
  moveNum.textContent = game.history.length + '수';
  $('undoBtn').disabled = aiThinking || (mode === 'ai'
    ? !game.history.some(m => m.color === humanColor)
    : game.history.length === 0);
}

function showModal() {
  if (!game.winner) return; // 연출 중 무르기/새 게임으로 승부가 사라진 경우
  const w = game.winner;
  const md = $('modalDot');
  if (w === 'draw') {
    md.className = 'dot draw';
    $('modalTitle').textContent = '무승부';
    $('modalDesc').textContent = '바둑판이 가득 찼어';
  } else {
    md.className = 'dot ' + (w === BLACK ? 'black' : 'white');
    const name = (w === BLACK ? '흑' : '백') + (mode === 'ai' && w !== humanColor ? ' (AI)' : '');
    $('modalTitle').textContent = name + ' 승리!';
    $('modalDesc').textContent = game.history.length + '수 만에 오목 완성';
  }
  overlay.classList.remove('hidden');
}

function eventToCell(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const gx = Math.round((mx - pad) / cell), gy = Math.round((my - pad) / cell);
  return inB(gx, gy) ? { x: gx, y: gy } : null;
}

function attemptMove(x, y) {
  if (game.winner || aiThinking) return;
  if (mode === 'ai' && game.current !== humanColor) return;
  const res = game.tryPlace(x, y);
  if (!res.ok) {
    if (res.reason) {
      flashStatus('⛔ 렌주 금수: ' + res.reason + ' — 흑은 여기 못 둠');
      Sound.forbid();
      animateForbidden(x, y);
    }
    return;
  }
  hover = null;
  Sound.stone();
  animatePlace(x, y);
  afterMove();
}

// 사람처럼 고민하는 딜레이: 초반엔 빠르게, 15% 확률로 장고
function aiDelay() {
  if (game.history.length < 4) return 400 + Math.random() * 500;
  const base = 600 + Math.random() * 900;
  const longThink = Math.random() < 0.15 ? 700 + Math.random() * 1300 : 0;
  return base + longThink;
}

function finishGame() {
  if (game.winner === 'draw') {
    Sound.draw();
    setTimeout(showModal, 450);
    return;
  }
  animateWin(game.winLine);
  Sound.boom(); // "쿵" 먼저, 팡파레는 살짝 뒤에
  const won = game.winner;
  setTimeout(() => {
    if (game.winner !== won) return;
    if (mode === 'ai' && won !== humanColor) Sound.lose();
    else Sound.win();
  }, 160);
  setTimeout(showModal, 1250); // 연출 감상 시간
}

function afterMove() {
  render();
  updateHud();
  if (game.winner) { finishGame(); return; }
  maybeAiTurn();
}

// 착수 후 + 새 게임 직후(사람이 백이면 AI 흑이 선공) 공용 AI 트리거
function maybeAiTurn() {
  if (mode !== 'ai' || game.winner || game.current === humanColor) return;
  aiThinking = true;
  updateHud();
  const gen = game.gen;
  setTimeout(() => {
    if (gen !== game.gen) return; // 생각 중에 새 게임 시작하면 폐기
    const m = AI.findBestMove(game, difficulty, difficulty === 'master');
    aiThinking = false;
    if (m) { game.tryPlace(m.x, m.y); Sound.stone(); animatePlace(m.x, m.y); }
    render();
    updateHud();
    if (game.winner) finishGame();
  }, aiDelay());
}

function doUndo() {
  if (aiThinking) return;
  let n;
  if (mode === 'ai') {
    // 마지막 "내 돌"까지 통째로 되돌림 → 색깔과 무관하게 항상 내 차례로 복귀
    const idx = game.history.map(m => m.color).lastIndexOf(humanColor);
    if (idx < 0) return;
    n = game.history.length - idx;
  } else {
    if (!game.history.length) return;
    n = 1;
  }
  game.undo(n);
  hover = null;
  clearAnims();
  overlay.classList.add('hidden');
  setStatus('');
  render();
  updateHud();
}

function newGame() {
  game.reset();
  aiThinking = false;
  hover = null;
  clearAnims();
  overlay.classList.add('hidden');
  setStatus('');
  render();
  updateHud();
  maybeAiTurn(); // 사람이 백이면 AI(흑)가 첫 수
}

canvas.addEventListener('mousemove', e => {
  const c = eventToCell(e);
  if ((c && (!hover || c.x !== hover.x || c.y !== hover.y)) || (!c && hover)) {
    hover = c;
    render();
  }
});
canvas.addEventListener('mouseleave', () => { hover = null; render(); });
canvas.addEventListener('click', e => {
  const c = eventToCell(e);
  if (c) attemptMove(c.x, c.y);
});

$('modeSel').addEventListener('change', e => {
  mode = e.target.value;
  $('diffSel').style.display = mode === 'ai' ? '' : 'none';
  $('colorSel').style.display = mode === 'ai' ? '' : 'none';
  newGame();
});
$('colorSel').addEventListener('change', e => {
  humanColor = e.target.value === 'black' ? BLACK : WHITE;
  newGame();
});
$('diffSel').addEventListener('change', e => { difficulty = e.target.value; });
$('ruleSel').addEventListener('change', e => {
  renjuOn = e.target.value === 'renju';
  $('ruleNote').textContent = renjuOn
    ? '흑 선공 · 정확히 5목만 승리(6목 이상 무효) · 흑 금수: 삼삼 3-3 / 사사 4-4 / 장목'
    : '흑 선공 · 정확히 5목만 승리(6목 이상 무효) · 자유룰: 금수 없음, 삼삼 OK';
  newGame();
});
$('newBtn').addEventListener('click', newGame);
const soundBtn = $('soundBtn');
soundBtn.textContent = Sound.enabled ? '🔊' : '🔇';
soundBtn.addEventListener('click', () => {
  soundBtn.textContent = Sound.toggle() ? '🔊' : '🔇';
});
$('undoBtn').addEventListener('click', doUndo);
$('modalNew').addEventListener('click', newGame);
$('modalClose').addEventListener('click', () => overlay.classList.add('hidden'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.add('hidden'); });
window.addEventListener('resize', resize);

resize();
updateHud();
</script>
</body>
</html>
